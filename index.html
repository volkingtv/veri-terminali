<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANLI VERİ TERMINALİ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: linear-gradient(45deg, #ff0000, #ff6a00);
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.6);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .card {
            background: #161b22;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .symbol { font-weight: bold; font-size: 16px; }
        .price { font-size: 15px; font-weight: 600; }
        .up { color: #00ff66; text-shadow: 0 0 5px #00ff66; }
        .down { color: #ff3333; text-shadow: 0 0 5px #ff3333; }
    </style>
</head>
<body>
    <div class="header">🔥 CANLI VERİ TERMINALİ 🔥</div>
    
    <div id="market-list">
        <div class="card">
            <span class="symbol">THYAO.IS</span>
            <span class="price up">312.50 TL (+2.4%)</span>
        </div>
        <div class="card">
            <span class="symbol">BETAE.IS</span>
            <span class="price down">101.90 TL (-2.58%)</span>
        </div>
        <div class="card">
            <span class="symbol">BTC/USDT</span>
            <span class="price up">$64,250 (+1.8%)</span>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
